name: GCC privacy watch (daily)

on:
  schedule:
    - cron: "17 3 * * *"   # every day at 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gcc-privacy-watch
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Collect today's updates
        run: node gcc-privacy-watch/scripts/update.mjs

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gcc-privacy-watch/data/updates.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "gcc-privacy-watch: daily update $(date -u +%F)"
            git push
          fi
