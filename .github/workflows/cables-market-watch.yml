name: Cables market watch (daily)

on:
  schedule:
    - cron: "43 17 * * 1-5"   # weekdays 17:43 UTC, after the LME official prices are published
    - cron: "13 6 * * *"      # every morning 06:13 UTC for overnight news
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cables-market-watch
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check parsers
        run: node cables-market-watch/scripts/test.mjs

      - name: Collect prices and news
        run: node cables-market-watch/scripts/update.mjs

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cables-market-watch/data/prices.json cables-market-watch/data/news.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "cables-market-watch: data update $(date -u '+%F %H:%M') UTC"
            git pull --rebase
            git push
          fi
