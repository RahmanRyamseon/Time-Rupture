name: Cables market watch (every 3 hours)

on:
  schedule:
    # Full crawl (~120 searches, tender databases, feeds) every 3 hours. The website's live
    # endpoint (/api/live) adds the newest items between crawls, so the page stays current.
    - cron: "13 */3 * * *"
    - cron: "43 17 * * 1-5"   # weekdays 17:43 UTC, right after the LME official prices are published
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cables-market-watch
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check parsers
        run: node cables-market-watch/scripts/test.mjs

      - name: Collect prices and news
        env:
          # Optional: a free SAM.gov public API key enables US federal tenders (WAPA, BPA, Army Corps).
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
        run: node cables-market-watch/scripts/update.mjs

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cables-market-watch/data/prices.json cables-market-watch/data/news.json cables-market-watch/data/run-report.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "cables-market-watch: data update $(date -u '+%F %H:%M') UTC"
            git pull --rebase
            git push
          fi
