name: attar-wiki

on:
  push:
    paths: ["attar-wiki/**", ".github/workflows/attar-wiki.yml"]
  pull_request:
    paths: ["attar-wiki/**", ".github/workflows/attar-wiki.yml"]

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: attar-wiki
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: attar-wiki/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run import -- all --dry-run
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Migrations + behaviour tests
        working-directory: attar-wiki
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          bash supabase/tests/run.sh | tee out.txt
          grep -q "ALL BEHAVIOUR TESTS PASSED" out.txt
