name: Gulf Rachabanda news (every 2 hours)

on:
  schedule:
    - cron: "27 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telugu-rachabanda
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check parser
        run: node telugu-rachabanda/scripts/test.mjs

      - name: Collect Gulf Telugu news and rupee rates
        run: node telugu-rachabanda/scripts/update.mjs

      - name: Commit updated news
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add telugu-rachabanda/data/news.json telugu-rachabanda/data/rates.json
          if git diff --cached --quiet; then
            echo "No news changes to commit."
          else
            git commit -m "telugu-rachabanda: news update $(date -u '+%F %H:%M') UTC"
            git pull --rebase
            git push
          fi
