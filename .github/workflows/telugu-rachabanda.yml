name: Gulf Telugu Guide (daily rates)

on:
  schedule:
    - cron: "37 4 * * *"   # daily, after the exchange-rate source updates
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telugu-rachabanda
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check guide content and calculator
        run: node telugu-rachabanda/scripts/test.mjs

      - name: Refresh rupee rates
        run: node telugu-rachabanda/scripts/rates.mjs

      - name: Check the page build
        run: node telugu-rachabanda/scripts/build-pages.mjs

      - name: Commit updated rates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add telugu-rachabanda/data/rates.json
          if git diff --cached --quiet; then
            echo "No rate changes to commit."
          else
            git commit -m "telugu-rachabanda: rates update $(date -u '+%F')"
            git pull --rebase
            git push
          fi
