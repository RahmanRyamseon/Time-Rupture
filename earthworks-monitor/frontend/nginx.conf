server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 64m;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy same-origin always;

  location /api/tiles/ {
    proxy_pass http://tiler:8000;
    proxy_set_header Host $host;
  }

  # Elevation rasters and satellite images can be many gigabytes: stream them to the API,
  # which enforces its own size limits (MAX_DEM_UPLOAD_MB, MAX_STEREO_UPLOAD_MB).
  location ~ ^/api/sites/[^/]+/(surfaces|stereo-surveys)$ {
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri /index.html;
  }
}
