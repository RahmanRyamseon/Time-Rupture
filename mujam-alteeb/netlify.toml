# Netlify reads this file from the base directory (mujam-alteeb/).
# In the Netlify UI set: Base directory = mujam-alteeb, Build command = npm run build, Publish = .next
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

# Next.js runtime (OpenNext): turns SSR, route handlers and the proxy/middleware into
# Netlify Functions and Edge Functions. Declared explicitly so upload-based deploys use it too.
[[plugins]]
  package = "@netlify/plugin-nextjs"
