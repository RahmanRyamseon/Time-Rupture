# Netlify reads this file from the base directory (mijmara/).
# In the Netlify UI set: Base directory = mijmara, Build command = npm run build, Publish = .next
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"
